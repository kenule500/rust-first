[package]
name = "axum-first"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] } # <-- Make sure derive is enabled!
serde_json = "1.0.154"
tokio = { version = "1.53.3", features = ["full"] }
tower-cookies = "0.11.0"
tower-http = { version = "0.7.1", features = ["fs"] }

[dev-dependencies]
anyhow = "1.0.104"
httpc-test = "0.1.10" # <-- Moved here!